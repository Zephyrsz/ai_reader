" font-size="17" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">Aa</text><text x="24" y="236" fill="#F4F5FB" font-size="20" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">今朝はいつもより少し早く</text><text x="24" y="272" fill="#F4F5FB" font-size="20" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">目が覚めました。窓を開けると、</text><text x="24" y="308" fill="#F4F5FB" font-size="20" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">涼しい風が部屋に入ってきます。</text><rect x="20" y="345" width="350" height="72" rx="12" fill="#303457"/><text x="24" y="370" fill="#DFE1FF" font-size="20" font-weight="500" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">駅へ向かう途中、小さな喫茶店で</text><text x="24" y="406" fill="#DFE1FF" font-size="20" font-weight="500" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">温かいコーヒーを買いました。</text><text x="24" y="464" fill="#F4F5FB" font-size="20" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">忙しい毎日でも、こうした時間を</text><text x="24" y="500" fill="#F4F5FB" font-size="20" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">大切にしたいと思います。</text><text x="24" y="563" fill="#B6BDD0" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">长按选择文字，或添加书签。</text><rect x="16" y="650" width="358" height="165" rx="28" fill="#1C2030" stroke="#3B4255" stroke-width="1"/><rect x="36" y="669" width="318" height="4" rx="2" fill