<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="文本编辑器"><title>文本编辑器</title><rect x="0" y="0" width="390" height="844" rx="38" fill="#F7F8FC"/><text x="24" y="93" fill="#5D6578" font-size="16" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">取消</text><text x="195" y="93" fill="#191D2B" font-size="22" font-weight="650" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">编辑文本</text><text x="366" y="93" fill="#4549E8" font-size="16" font-weight="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">保存</text><text x="24" y="144" fill="#5D6578" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">标题</text><rect x="24" y="158" width="342" height="52" rx="14" fill="#FFFFFF"/><text x="40" y="191" fill="#191D2B" font-size="17" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">京都の朝、いつもの道</text><rect x="24" y="228" width="105" height="28" rx="14" fill="#EEF0F6"/><text x="76.5" y="247" fill="#5D6578" font-size="12" font-weight="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">日本語 · ja-JP</text><text x="366" y="248" fill="#5D6578" font-size="12" font-weight="400" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">286 字（示例）</text><text x="24" y="292" fill="#5D6578" font-size="13" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">正文</text><text x="366" y="292" fill="#4549E8" font-size="14" font-weight="500" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">粘贴</text><rect x="24" y="307" width="342" height="350" rx="18" fill="#FFFFFF"/><text x="40" y="345" fill="#191D2B" font-size="18" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">今朝はいつもより少し早く</text><text x="40" y="377" fill="#191D2B" font-size="18" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">目が覚めました。窓を開けると、</text><text x="40" y="409" fill="#191D2B" font-size="18" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">涼しい風が部屋に入ってきます。</text><text x="40" y="473" fill="#191D2B" font-size="18" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">駅へ向かう途中、小さな喫茶店で</text><text x="40" y="505" fill="#191D2B" font-size="18" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">温かいコーヒーを買いました。</text><rect x="40" y="572" width="2" height="26" rx="1" fill="#4549E8"/><g transform="translate(24,679) scale(0.7083333333333334)" fill="none" stroke="#23684E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L20 5"/></g><text x="50" y="693" fill="#5D6578" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">已保存到本机 · 状态示意</text><rect x="24" y="724" width="342" height="72" rx="18" fill="#ECEBFF"/><g transform="translate(41,747) scale(1.0)" fill="none" stroke="#4549E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C8 3 4 3 2 4v15c3-1 7-1 10 2m0-15c4-3 8-3 10-2v15c-3-1-7-1-10 2V6Z"/></g><text x="83" y="750" fill="#3338B0" font-size="15" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">保存后进入阅读器</text><text x="83" y="775" fill="#3338B0" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif">编辑内容保留在本机，不发送到服务器。</text></svg>